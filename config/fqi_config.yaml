# @package _global_
# Shared parameter set for FQI/RFQI training.
# Default configuration for the FQI algorithm.
defaults:
  - _self_
  - env/fqi: pendulum
  - env_mods  # Environment modification settings
  - override hydra/job_logging: default
  - override hydra/hydra_logging: default

# ------------  General settings  ------------
# Device to use
device: cuda
# Whether to write TensorBoard summaries
write: false
# Whether to print network losses during training
debug_print: false
# Whether to enable render mode in Gymnasium
render: false
# Whether to load a model (typically for evaluation)
load_model: false
# Model loading path
load_path: None
# Whether to run evaluation only
eval_model: false
# Whether to save the model during training
save_model: true
# Dataset path in offline mode
data_path: None

# ------------  Training settings  ------------
# Random seed
seed: 42
# Evaluation interval (in training steps)
eval_freq: 1e4
save_interval: 2e3
# Maximum training steps for FQI
max_trn_steps: 5e5
max_vae_trn_step: 2e5
data_size: 1000000
# Use D4RL dataset
d4rl: False
d4rl_v2: False
d4rl_expert: False
# Use mixed dataset
mixed: False
# Extra run label/comment
comment: ''
# Save rollout video
video: False

# Minibatch size for networks
batch_size: 1000 
# Discount factor
gamma: 0.99 
# Target network update rate
tau: 0.005
# Weighting for clipped double Q-learning in BCQ
lmbda: 0.75
# Max perturbation hyperparameter for BCQ
phi: 0.1
# Epsilon for Adam
adam_eps: 1e-6
# Adam step size
adam_lr: 1e-3
# Learning rates for actor/critic
actor_lr: 1e-3
critic_lr: 1e-3
# Number of sampled actions for backup
n_action: 100
# Number of sampled actions for execution
n_action_execute: 100
# Number of training iterations per step
max_iter: 1000

# BCQ-PQL parameters
# "QL": Q-learning (Q-max) backup, "AC": actor-critic backup
backup: 'QL'
# Next-action noise in QL
ql_noise: 0.15
# If true, use percentile to set beta (b in the paper)
automatic_beta: False
# Use x-percentile as beta
beta_percentile: 2.0 
# Hardcoded beta, used only when `automatic_beta` is false
beta: -0.4
# Minimum value baseline for the environment
# Empirically set from ~1000 random rollouts
vmin: 0

# ------------  Environment configurations  ------------
# Whether to apply reward shaping
reward_adapt: false # only for pendulum and lunarlander
# Whether to normalize rewards
reward_normalize: false
# Whether to enable robust training
robust: false
# Radius of TV-distance ball
rho: 0.5
# Probability of random actions during evaluation/testing
random_action_prob: 0.0

# Hydra output directory
hydra:
  run:
    dir: ./outputs/FQI/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/FQI/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    name: ${env_name}_training
    chdir: true  # Change to the output directory




